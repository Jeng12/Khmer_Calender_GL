name: Build Debug APK

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses and install platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || \
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          [ -z "${{ secrets.GEMINI_API_KEY }}" ] && echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env || true

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        id: test
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Report test failure
        if: failure() && steps.test.outcome == 'failure'
        run: |
          {
            echo "## Unit test failure (last 100 log lines)"
            echo '```'
            tail -n 100 test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE "e: |error: |FAILURE:|What went wrong|Caused by:|Unresolved reference|> Task .* FAILED|expected:.*but was:|Tests? (FAILED|run:)" test.log \
            | head -n 50 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            test.log
            app/build/reports/tests/
          retention-days: 7

      - name: Run Android Lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          {
            echo "## Build failure (last 100 log lines)"
            echo '```'
            tail -n 100 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface key error lines as annotations (readable via the public check-runs API)
          grep -nE "e: |error: |FAILURE:|What went wrong|Caused by:|Unresolved reference|Could not (resolve|find)|> Task .* FAILED|Compilation error" build.log \
            | head -n 50 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: khmer-calendar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK size
        if: success()
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk
